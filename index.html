<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Data Pegawai - YASPA</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- DataTables & Buttons Extension CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css" rel="stylesheet">

    <style>
        :root {
            --sb-bg: #f4f7fe;
            --sb-card-bg: #ffffff;
            --sb-primary: #4318ff;
            --sb-primary-hover: #3311db;
            --sb-text-main: #2b3674;
            --sb-text-muted: #a3edd9;
            --sb-border: #e9ecef;
            --sb-radius: 1.5rem;
        }

        body {
            background-color: var(--sb-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--sb-text-main);
        }

        /* Modern Card Styling SB Admin Pro */
        .card-sb {
            border: none;
            border-radius: var(--sb-radius) !important;
            box-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
            background: var(--sb-card-bg);
            transition: all 0.3s ease;
        }

        .card-sb .card-header {
            background: transparent;
            border-bottom: 1px solid var(--sb-border);
            padding: 1.25rem 1.5rem;
            font-weight: 700;
            color: var(--sb-text-main);
            border-top-left-radius: var(--sb-radius) !important;
            border-top-right-radius: var(--sb-radius) !important;
        }

        /* Form Inputs */
        .form-control, .form-select {
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            padding: 0.55rem 0.9rem;
            font-size: 0.875rem;
            color: var(--sb-text-main);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--sb-primary);
            box-shadow: 0 0 0 0.25rem rgba(67, 24, 255, 0.15);
        }

        /* Buttons */
        .btn-primary-sb {
            background-color: var(--sb-primary);
            border-color: var(--sb-primary);
            color: #fff;
            border-radius: 0.75rem;
            font-weight: 600;
            padding: 0.55rem 1.25rem;
        }

        .btn-primary-sb:hover {
            background-color: var(--sb-primary-hover);
            border-color: var(--sb-primary-hover);
            color: #fff;
        }

        .btn-secondary-sb {
            border-radius: 0.75rem;
            font-weight: 600;
            padding: 0.55rem 1.25rem;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* DataTables Custom Styling */
        .table-custom {
            font-size: 0.85rem;
        }

        .table-custom thead th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--sb-border);
            white-space: nowrap;
        }

        .dt-buttons .btn {
            border-radius: 0.6rem !important;
            margin-right: 0.3rem;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.active .page-link {
            background-color: var(--sb-primary) !important;
            border-color: var(--sb-primary) !important;
            border-radius: 0.5rem;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button .page-link {
            border-radius: 0.5rem;
            margin: 0 2px;
            color: var(--sb-text-main);
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
    </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner-border text-primary" role="status" style="width: 3.5rem; height: 3.5rem; border-width: 0.25em;"></div>
    <h6 class="mt-3 font-weight-bold text-primary">Memproses Data Sheets...</h6>
</div>

<!-- Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-primary fs-4" href="#">
            <i class="fas fa-users-gear me-2"></i>YASPA-PAJAK
        </a>
        <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-semibold">
            <i class="fas fa-database me-1"></i> Live Google Sheets API
        </span>
    </div>
</nav>

<div class="container-fluid px-4 pb-5">
    <div class="row">
        <!-- Form Input -->
        <div class="col-xl-4 col-lg-5 mb-4">
            <div class="card card-sb shadow-sm">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h6 class="m-0 fw-bold" id="formTitle"><i class="fas fa-user-plus me-2 text-primary"></i>Tambah Pegawai Baru</h6>
                </div>
                <div class="card-body p-4" style="max-height: 75vh; overflow-y: auto;">
                    <form id="formPegawai">
                        <input type="hidden" id="rowId">
                        <input type="hidden" id="noUrut">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Nama Lengkap</label>
                            <input type="text" class="form-control" id="nama" required placeholder="Masukkan nama lengkap">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary small">Posisi</label>
                                <input type="text" class="form-control" id="posisi" placeholder="Jabatan/Posisi">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary small">Status Pegawai</label>
                                <input type="text" class="form-control" id="status_pegawai" placeholder="Tetap/Kontrak">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary small">Status (TK/K)</label>
                                <input type="text" class="form-control" id="tk" placeholder="TK/0, K/1, dll">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary small">Gol / Ruang</label>
                                <input type="text" class="form-control" id="gol" placeholder="Contoh: III/a">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">ID TKU</label>
                            <input type="text" class="form-control" id="id_tku" placeholder="Nomor ID TKU">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Unit Kerja</label>
                            <input type="text" class="form-control" id="unit" placeholder="Nama Unit/Yayasan">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary small">NPWP</label>
                                <input type="text" class="form-control" id="npwp" placeholder="Nomor NPWP">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary small">Kode Pajak</label>
                                <input type="text" class="form-control" id="kode_pajak" placeholder="Kode Pajak">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Gaji Bruto (Rp)</label>
                            <input type="number" class="form-control" id="gaji" placeholder="0">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary-sb" id="btnSubmit"><i class="fas fa-save me-1"></i> Simpan ke Sheets</button>
                            <button type="button" class="btn btn-light btn-secondary-sb" onclick="resetForm()"><i class="fas fa-undo me-1"></i> Batal</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabel Data Pegawai -->
        <div class="col-xl-8 col-lg-7">
            <div class="card card-sb shadow-sm">






<!-- Pada bagian Card Header Tabel Pegawai -->
<div class="card-header py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
    <h6 class="m-0 fw-bold"><i class="fas fa-table me-2 text-primary"></i>Daftar Pegawai Active</h6>
    <div class="d-flex gap-2">
        <button class="btn btn-sm btn-success rounded-pill px-3 fw-semibold" onclick="prosesHitungPPh21()">
            <i class="fas fa-calculator me-1"></i> Hitung & Buat Sheet PPh 21
        </button>
        <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="loadData()">
            <i class="fas fa-sync-alt me-1"></i> Segarkan Data
        </button>
    </div>
</div>









                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table id="dataTablePegawai" class="table table-hover table-custom align-middle w-100">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Nama</th>
                                    <th>Posisi</th>
                                    <th>Status</th>
                                    <th>TK/K</th>
                                    <th>Gol/Ruang</th>
                                    <th>ID TKU</th>
                                    <th>Unit</th>
                                    <th>NPWP</th>
                                    <th>Kode Pajak</th>
                                    <th>Gaji Bruto</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelPegawai">
                                <!-- Data dimasukkan oleh JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- DataTables & Export Extensions JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

<script src="app.js"></script>
</body>
</html>
