<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Data Pegawai (Google Sheets API)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f2f6fc; font-family: 'Nunito', sans-serif; }
        .card-header { background-color: #f8f9fc; border-bottom: 1px solid #e3e6f0; font-weight: bold; color: #4e73df; }
        .table-custom th { background-color: #4e73df; color: white; text-align: center; white-space: nowrap; }
        .table-custom td { vertical-align: middle; white-space: nowrap; }
        .action-btn { width: 35px; height: 35px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 1050; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
    </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 text-primary">Memproses Data Sheets...</h5>
</div>

<div class="container-fluid px-4 py-4">
    <h1 class="mt-4 mb-4 text-dark">Manajemen Data Pegawai</h1>

    <div class="row">
        <!-- Formulir Input -->
        <div class="col-xl-4 col-lg-5 mb-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0" id="formTitle">Tambah Pegawai Baru</h6>
                </div>
                <div class="card-body" style="max-height: 75vh; overflow-y: auto;">
                    <form id="formPegawai">
                        <input type="hidden" id="rowId">
                        <input type="hidden" id="noUrut">
                        
                        <div class="mb-2">
                            <label class="form-label mb-1">Nama Lengkap</label>
                            <input type="text" class="form-control form-control-sm" id="nama" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label mb-1">Posisi</label>
                                <input type="text" class="form-control form-control-sm" id="posisi">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label mb-1">Status Pegawai</label>
                                <input type="text" class="form-control form-control-sm" id="status_pegawai">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label mb-1">TK/K</label>
                                <input type="text" class="form-control form-control-sm" id="tk">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label mb-1">Gol / Ruang</label>
                                <input type="text" class="form-control form-control-sm" id="gol">
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label mb-1">ID TKU</label>
                            <input type="text" class="form-control form-control-sm" id="id_tku">
                        </div>

                        <div class="mb-2">
                            <label class="form-label mb-1">Unit</label>
                            <input type="text" class="form-control form-control-sm" id="unit">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label mb-1">NPWP</label>
                                <input type="text" class="form-control form-control-sm" id="npwp">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label mb-1">Kode Pajak</label>
                                <input type="text" class="form-control form-control-sm" id="kode_pajak">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label mb-1">Gaji Bruto</label>
                            <input type="number" class="form-control form-control-sm" id="gaji">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary" id="btnSubmit"><i class="fas fa-save me-1"></i> Simpan ke Sheets</button>
                            <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-undo me-1"></i> Batal</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="col-xl-8 col-lg-7">
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                    <h6 class="m-0">Daftar Pegawai YASPA-PAJAK</h6>
                    <button class="btn btn-sm btn-outline-primary" onclick="loadData()"><i class="fas fa-sync-alt"></i> Segarkan</button>
                </div>
                <div class="card-body">
                    <div class="table-responsive" style="max-height: 75vh; overflow-y: auto;">
                        <table class="table table-bordered table-hover table-custom" width="100%" cellspacing="0">
                            <thead style="position: sticky; top: 0; z-index: 1;">
                                <tr>
                                    <th>No</th>
                                    <th>Nama</th>
                                    <th>Posisi</th>
                                    <th>Status</th>
                                    <th>TK/K</th>
                                    <th>Gol/Ruang</th>
                                    <th>ID TKU</th>
                                    <th>Unit</th>
                                    <th>NPWP</th>
                                    <th>Kode Pajak</th>
                                    <th>Gaji Bruto</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelPegawai">
                                <tr><td colspan="12" class="text-center py-4">Memuat data dari Google Sheets...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
